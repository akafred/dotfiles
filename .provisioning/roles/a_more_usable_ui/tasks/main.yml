- name: remove not-Tahoe-compatible version of Ice
  homebrew_cask:
    name:
      - jordanbaird-ice
    state: absent

- name: install applications
  homebrew_cask:
    name:
      #      - divvy - needs rosetta
      - flycut
      - raycast
      - iterm2
    install_options: force

- name: install Ice beta (needed on macOS 26 Tahoe)
  homebrew_cask:
    name: jordanbaird-ice@beta
    install_options: force
  when: ansible_distribution_major_version | int < 27

- name: remove Ice beta (not needed from macOS 27)
  homebrew_cask:
    name: jordanbaird-ice@beta
    state: absent
  when: ansible_distribution_major_version | int >= 27

- name: install apps from Mac App Store
  shell: 'mas list | grep "{{ item }}" || mas search "{{ item }}" | grep "{{ item }}" | head -n 1 | awk ''{print $1}'' | xargs mas install'
  args:
    executable: /bin/bash
  with_items:
    - Amphetamine
#    - Todoist

